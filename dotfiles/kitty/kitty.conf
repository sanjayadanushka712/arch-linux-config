# ============================================================
#  Kitty Terminal — Apple Mac style with glass transparency
# ============================================================

# --- Font ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0
font_features    none

# --- Geometry ---
window_padding_width       24
single_window_padding_width 12
window_margin_width        0
remember_window_size       yes
initial_window_width       1100
initial_window_height      700

# --- Titlebar (macOS-style) ---
hide_window_decorations no
macos_titlebar_color   background
macos_option_as_alt    yes
confirm_os_window_close -1

# --- Transparency (subtle, for readability) ---
background_opacity        0.94
background_blur           0
dynamic_background_opacity yes
background_image          none
background_image_layout   tiled

# Per-window opacity for inactive windows
# inactive_text_alpha 1.0

# --- Cursor ---
cursor_shape             block
cursor_shape_unfocused   hollow
cursor_beam_thickness    1.5
cursor_blink_interval    0
cursor_stop_blinking_after 2.0

# --- Scrolling & Selection ---
scrollback_lines        10000
scrollback_pager_history_size 100
mouse_hide_wait          3.0
clipboard_control       write-primary
strip_trailing_spaces   smart

# --- Bell ---
enable_audio_bell       no
visual_bell_duration    0.0
bell_on_tab             no

# --- Tabs (minimal, hidden when only one) ---
tab_bar_style           simple
tab_bar_min_tabs        2
tab_title_template      "{index}: {title}"
active_tab_foreground   #0b0f0c
active_tab_background   #7ec87e
inactive_tab_foreground #6b756b
inactive_tab_background #121712

# --- Performance ---
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- Shell integration ---
shell_integration enabled
allow_remote_control yes
listen_on         unix:/tmp/kitty.sock

# --- URL handling ---
detect_urls yes
url_style     straight

# --- Color scheme ---
include hacker-amber.conf
